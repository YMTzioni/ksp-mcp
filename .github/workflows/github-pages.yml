name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages config
        env:
          CORS_PROXY: ${{ vars.CORS_PROXY }}
        run: |
          PROXY="${CORS_PROXY}"
          if [ -z "$PROXY" ]; then
            PROXY="https://api.allorigins.win/raw?url="
          fi
          printf 'window.__KSP_CONFIG__ = {\n  mode: "client",\n  corsProxy: "%s",\n};\n' "$PROXY" > public/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
