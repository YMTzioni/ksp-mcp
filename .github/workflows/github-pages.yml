name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        env:
          KSP_API_PROXY: ${{ vars.KSP_API_PROXY }}
        run: |
          API="${KSP_API_PROXY}"
          if [ -z "$API" ]; then
            API="https://ksp-api-proxy.YMTzioni.workers.dev"
          fi
          printf 'window.__KSP_CONFIG__ = {\n  mode: "client",\n  apiProxy: "%s",\n};\n' "$API" > config.js
          mkdir -p _site
          cp index.html config.js .nojekyll _site/
          cp -r css js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
